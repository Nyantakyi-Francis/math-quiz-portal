<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Vectors (Advanced) | Nyantakyi Francis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
        onload="renderMathInElement(document.body);"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9;
        }

        .question-card {
            transition: border-color 0.2s;
        }

        .question-card:focus-within {
            border-color: #4f46e5;
        }

        .katex-display {
            overflow-x: auto;
            overflow-y: hidden;
        }
    </style>
</head>

<body class="pb-20">

    <header class="bg-white border-b sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="../index.html" class="text-indigo-600 font-bold flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd"
                        d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z"
                        clip-rule="evenodd" />
                </svg>
                Back to Portal
            </a>
            <div class="text-right">
                <h1 class="font-bold text-slate-800">Elective Maths</h1>
                <p class="text-xs text-slate-500 uppercase tracking-widest">Module 6: Vectors </p>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 mt-8">
        <form id="quizForm" action="https://formspree.io/f/xvzbgroo" method="POST">

            <div class="bg-indigo-700 rounded-xl p-8 mb-8 text-white shadow-lg">
                <h2 class="text-2xl font-bold mb-6 text-center underline underline-offset-8">Student Information</h2>
                <div class="grid md:grid-cols-1 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-indigo-100 mb-2">Full Name</label>
                        <input type="text" name="student_name" required placeholder="Enter your full name"
                            class="w-full px-4 py-3 rounded-lg bg-indigo-800 border-indigo-600 text-white placeholder-indigo-300 focus:outline-none focus:ring-2 focus:ring-white">
                    </div>
                    <div class="grid md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-indigo-100 mb-2">Email Address</label>
                            <input type="email" name="student_email" required placeholder="example@email.com"
                                class="w-full px-4 py-3 rounded-lg bg-indigo-800 border-indigo-600 text-white placeholder-indigo-300 focus:outline-none focus:ring-2 focus:ring-white">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-indigo-100 mb-2">Phone Number</label>
                            <input type="tel" name="student_phone" required placeholder="e.g. +233 50 000 0000"
                                class="w-full px-4 py-3 rounded-lg bg-indigo-800 border-indigo-600 text-white placeholder-indigo-300 focus:outline-none focus:ring-2 focus:ring-white">
                        </div>
                    </div>
                </div>
            </div>

            <div id="questions-container" class="space-y-6"></div>

            <input type="hidden" name="quiz_topic" value="Advanced Vectors">
            <input type="hidden" name="final_score" id="score_field">
            <input type="hidden" name="_subject" id="email_subject" value="New Math Quiz Submission">

            <div class="mt-12 text-center p-8 bg-white rounded-xl shadow-sm border border-slate-200">
                <button type="submit" id="submitBtn"
                    class="bg-indigo-600 text-white px-10 py-4 rounded-xl font-bold text-lg hover:bg-indigo-700 transition-colors shadow-lg shadow-indigo-200">
                    Finish & Submit Results
                </button>
            </div>
        </form>
    </main>

    <script>
        const questionsData = [
            { q: "Given points $A(2, -3)$ and $B(-4, 5)$, find the unit vector in the direction of $\\vec{AB}$.", options: ["$-0.6i + 0.8j$", "$\\frac{1}{10}(-6i + 8j)$", "$\\frac{1}{10}(6i - 8j)$", "$\\frac{1}{\\sqrt{10}}(-3i + 4j)$"], correct: "$-0.6i + 0.8j$" },
            { q: "If $\\vec{p} = 3i + (k-1)j$ and $|\\vec{p}| = 5$, find the possible values of $k$.", options: ["$5, -3$", "$4, -4$", "$5, 4$", "$3, -3$"], correct: "$5, -3$" },
            { q: "The position vectors of $P$ and $Q$ are $2i + 3j$ and $5i - j$ respectively. Find $|\\vec{PQ}|$.", options: ["$5$", "$7$", "$\\sqrt{13}$", "$\\sqrt{37}$"], correct: "$5$" },
            { q: "Find the coordinates of $R$ such that $\\vec{OR} = 3\\vec{a} - 2\\vec{b}$ where $\\vec{a} = \\binom{1}{2}$ and $\\vec{b} = \\binom{-2}{3}$.", options: ["$(7, 0)$", "$(7, 12)$", "$(-1, 0)$", "$(5, 0)$"], correct: "$(7, 0)$" },
            { q: "If $\\vec{v} = \\binom{m}{12}$ is a unit vector, find $m^2$.", options: ["No real value", "$143/144$", "$-143$", "$1$"], correct: "No real value" },
            { q: "Express $210^\\circ$ as a unit vector in terms of $i$ and $j$.", options: ["$-\\frac{\\sqrt{3}}{2}i - \\frac{1}{2}j$", "$\\frac{\\sqrt{3}}{2}i - \\frac{1}{2}j$", "$-\\frac{1}{2}i - \\frac{\\sqrt{3}}{2}j$", "$\\frac{1}{2}i + \\frac{\\sqrt{3}}{2}j$"], correct: "$-\\frac{\\sqrt{3}}{2}i - \\frac{1}{2}j$" },
            { q: "If $\\vec{OA} = \\mathbf{a}$ and $\\vec{OB} = \\mathbf{b}$, find the position vector of point $M$ which divides $AB$ in the ratio $3:2$.", options: ["$\\frac{2\\mathbf{a} + 3\\mathbf{b}}{5}$", "$\\frac{3\\mathbf{a} + 2\\mathbf{b}}{5}$", "$\\frac{2\\mathbf{a} - 3\\mathbf{b}}{1}$", "$\\frac{3\\mathbf{b} - 2\\mathbf{a}}{5}$"], correct: "$\\frac{2\\mathbf{a} + 3\\mathbf{b}}{5}$" },
            { q: "Find the value of $x$ such that $\\binom{x}{6}$ is parallel to $\\binom{2}{-3}$.", options: ["$-4$", "$4$", "$-9$", "$9$"], correct: "$-4$" },
            { q: "In $\\triangle ABC$, $\\vec{AB} = \\mathbf{u}$ and $\\vec{AC} = \\mathbf{v}$. If $D$ is the midpoint of $BC$, find $\\vec{AD}$.", options: ["$\\frac{1}{2}(\\mathbf{u} + \\mathbf{v})$", "$\\mathbf{v} - \\mathbf{u}$", "$\\frac{1}{2}(\\mathbf{v} - \\mathbf{u})$", "$\\mathbf{u} + \\mathbf{v}$"], correct: "$\\frac{1}{2}(\\mathbf{u} + \\mathbf{v})$" },
            { q: "Points $L(2, 3)$, $M(4, 7)$ and $N(x, y)$ are collinear. If $\\vec{LM} = \\frac{1}{2}\\vec{MN}$, find $N$.", options: ["$(8, 15)$", "$(6, 11)$", "$(10, 19)$", "$(5, 9)$"], correct: "$(8, 15)$" },
            { q: "If $\\vec{p} = \\binom{2}{1}$, $\\vec{q} = \\binom{3}{-4}$ and $\\vec{r} = \\binom{11}{-6}$, find scalars $h$ and $k$ such that $h\\vec{p} + k\\vec{q} = \\vec{r}$.", options: ["$h=4, k=1$", "$h=2, k=3$", "$h=1, k=3$", "$h=4, k=-1$"], correct: "$h=4, k=1$" },
            { q: "In a parallelogram $OABC$, $\\vec{OA} = \\mathbf{a}$ and $\\vec{OC} = \\mathbf{c}$. $E$ is the midpoint of $AB$. Express $\\vec{OE}$ in terms of $\\mathbf{a}$ and $\\mathbf{c}$.", options: ["$\\mathbf{a} + \\frac{1}{2}\\mathbf{c}$", "$\\mathbf{c} + \\frac{1}{2}\\mathbf{a}$", "$\\frac{1}{2}(\\mathbf{a} + \\mathbf{c})$", "$\\mathbf{a} - \\frac{1}{2}\\mathbf{c}$"], correct: "$\\mathbf{a} + \\frac{1}{2}\\mathbf{c}$" },
            { q: "If the resultant of $\\binom{a}{3}$ and $\\binom{4}{b}$ is $\\binom{2}{-1}$, find $(a, b)$.", options: ["$(-2, -4)$", "$(2, 4)$", "$(6, 2)$", "$(-2, 4)$"], correct: "$(-2, -4)$" },
            { q: "A point $C$ divides $\\vec{AB}$ externally in the ratio $5:2$. If $\\vec{OA}=\\mathbf{a}$ and $\\vec{OB}=\\mathbf{b}$, then $\\vec{OC}$ is:", options: ["$\\frac{5\\mathbf{b} - 2\\mathbf{a}}{3}$", "$\\frac{2\\mathbf{a} - 5\\mathbf{b}}{3}$", "$\\frac{5\\mathbf{a} - 2\\mathbf{b}}{3}$", "$\\frac{5\\mathbf{b} + 2\\mathbf{a}}{3}$"], correct: "$\\frac{5\\mathbf{b} - 2\\mathbf{a}}{3}$" },
            { q: "If $|\\vec{a}| = 13$, $|\\vec{b}| = 5$ and the vectors are perpendicular, find $|\\vec{a} - \\vec{b}|$.", options: ["$\\sqrt{194}$", "$8$", "$18$", "$\\sqrt{144}$"], correct: "$\\sqrt{194}$" },
            { q: "Find the direction cosine of the vector $3i - 4j$ with respect to the y-axis.", options: ["$-4/5$", "$3/5$", "$4/5$", "$-3/5$"], correct: "$-4/5$" },
            { q: "Calculate the dot product of $\\vec{u} = 2i + 5j$ and $\\vec{v} = 3i - 2j$.", options: ["$-4$", "$16$", "$11$", "$1$"], correct: "$-4$" },
            { q: "If $\\vec{a} \\cdot \\vec{b} = 0$, the angle between the vectors is:", options: ["$90^\\circ$", "$0^\\circ$", "$180^\\circ$", "$45^\\circ$"], correct: "$90^\\circ$" },
            { q: "Find the angle between $\\vec{a} = \\binom{1}{1}$ and $\\vec{b} = \\binom{0}{1}$.", options: ["$45^\\circ$", "$90^\\circ$", "$30^\\circ$", "$60^\\circ$"], correct: "$45^\\circ$" },
            { q: "Given $|\\mathbf{a}|=3$, $|\\mathbf{b}|=4$ and the angle between them is $60^\\circ$, find $\\mathbf{a} \\cdot \\mathbf{b}$.", options: ["$6$", "$12$", "$6\\sqrt{3}$", "$0$"], correct: "$6$" },
            { q: "Find the value of $p$ if $pi + 2j$ is perpendicular to $4i - 3j$.", options: ["$1.5$", "$-1.5$", "$0.66$", "$-0.66$"], correct: "$1.5$" },
            { q: "Calculate $(\\vec{a} + \\vec{b}) \\cdot (\\vec{a} - \\vec{b})$ if $|\\vec{a}|=5$ and $|\\vec{b}|=3$.", options: ["$16$", "$34$", "$8$", "$0$"], correct: "$16$" },
            { q: "If $\\cos \\theta = \\frac{\\mathbf{a} \\cdot \\mathbf{b}}{|\\mathbf{a}||\\mathbf{b}|}$, find $\\theta$ for $\\mathbf{a}=i+j$ and $\\mathbf{b}=i-j$.", options: ["$90^\\circ$", "$0^\\circ$", "$45^\\circ$", "$180^\\circ$"], correct: "$90^\\circ$" },
            { q: "If $|\\vec{a}+\\vec{b}| = |\\vec{a}-\\vec{b}|$, then $\\vec{a}$ and $\\vec{b}$ are:", options: ["Perpendicular", "Parallel", "Equal", "Unit vectors"], correct: "Perpendicular" },
            { q: "Three forces $\\mathbf{F_1} = \\binom{2}{3}$, $\\mathbf{F_2} = \\binom{-1}{4}$ and $\\mathbf{F_3} = \\binom{x}{y}$ are in equilibrium. Find $(x, y)$.", options: ["$(-1, -7)$", "$(1, 7)$", "$(1, -7)$", "$(-1, 7)$"], correct: "$(-1, -7)$" },
            { q: "Find the magnitude of the resultant of $7i - 2j$ and $-3i + 5j$.", options: ["$5$", "$25$", "$\\sqrt{65}$", "$\\sqrt{13}$"], correct: "$5$" },
            { q: "A force $P$ of magnitude $10N$ acts on a bearing of $060^\\circ$. Express $P$ in component form.", options: ["$5\\sqrt{3}i + 5j$", "$5i + 5\\sqrt{3}j$", "$10i + 10j$", "$5i - 5j$"], correct: "$5\\sqrt{3}i + 5j$" },
            { q: "Find the work done by a force $\\vec{F} = \\binom{3}{4}$ in moving an object from $(1, 2)$ to $(5, 5)$.", options: ["$24$ units", "$25$ units", "$12$ units", "$15$ units"], correct: "$24$ units" },
            { q: "The resultant of two equal forces $F$ acting at $120^\\circ$ to each other is:", options: ["$F$", "$2F$", "$F\\sqrt{3}$", "$0$"], correct: "$F$" },
            { q: "Two forces of $3N$ and $4N$ act at right angles. The direction of the resultant relative to the $3N$ force is:", options: ["$\\tan^{-1}(4/3)$", "$\\tan^{-1}(3/4)$", "$45^\\circ$", "$90^\\circ$"], correct: "$\\tan^{-1}(4/3)$" },
            { q: "A particle is acted upon by forces $2i+3j$, $i-4j$, and $-3i+j$. The particle is:", options: ["At equilibrium", "Moving North", "Moving South", "Accelerating"], correct: "At equilibrium" },
            { q: "Find the projection of $\\vec{a}$ onto $\\vec{b}$ using the formula:", options: ["$\\frac{\\vec{a} \\cdot \\vec{b}}{|\\vec{b}|}$", "$\\vec{a} \\cdot \\vec{b}$", "$\\frac{\\vec{a} \\cdot \\vec{b}}{|\\vec{a}|}$", "$\\vec{a} + \\vec{b}$"], correct: "$\\frac{\\vec{a} \\cdot \\vec{b}}{|\\vec{b}|}$" },
            { q: "If $\\vec{a}$ and $\\vec{b}$ are unit vectors and the angle between them is $60^\\circ$, find $|\\vec{a} + \\vec{b}|$.", options: ["$\\sqrt{3}$", "$2$", "$1$", "$\\sqrt{2}$"], correct: "$\\sqrt{3}$" },
            { q: "In $\\triangle ABC$, $\\vec{AB} + \\vec{BC} + \\vec{CA}$ is equal to:", options: ["$\\mathbf{0}$", "$2\\vec{AC}$", "$2\\vec{AB}$", "$\\vec{ABC}$"], correct: "$\\mathbf{0}$" },
            { q: "Find the bearing of the vector $-i - j$.", options: ["$225^\\circ$", "$135^\\circ$", "$045^\\circ$", "$315^\\circ$"], correct: "$225^\\circ$" },
            { q: "A plane flies at $200$ km/h on a bearing of $300^\\circ$. Find the westerly component of its velocity.", options: ["$100\\sqrt{3}$ km/h", "$100$ km/h", "$200$ km/h", "$173$ km/h"], correct: "$100\\sqrt{3}$ km/h" },
            { q: "If $\\mathbf{r} = (t^2)i + (2t-1)j$, find the velocity vector at $t=2$.", options: ["$4i + 2j$", "$4i + 3j$", "$2i + 2j$", "$i + j$"], correct: "$4i + 2j$" },
            { q: "Two vectors are collinear if the area of the triangle formed by them is:", options: ["Zero", "One", "Positive", "Undefined"], correct: "Zero" },
            { q: "If $P$ is $(2, 5)$ and the vector $\\vec{PQ} = \\binom{-3}{4}$, find the coordinates of $Q$.", options: ["$(-1, 9)$", "$(5, 1)$", "$(1, -9)$", "$(-5, -1)$"], correct: "$(-1, 9)$" },
            { q: "Simplify $3(2i - j) - 2(i + 4j) + 5j$.", options: ["$4i - 6j$", "$4i + 10j$", "$8i - 3j$", "$4i - j$"], correct: "$4i - 6j$" }
        ];

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        const container = document.getElementById('questions-container');

        function renderQuestions() {
            questionsData.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = "question-card bg-white p-6 rounded-xl border border-slate-200 shadow-sm";

                // Shuffle options for each question
                let shuffledOptions = [...item.options];
                shuffleArray(shuffledOptions);

                div.innerHTML = `
                    <div class="font-bold text-slate-800 mb-4 flex items-start">
                        <span class="bg-slate-100 text-slate-500 rounded-lg w-8 h-8 flex items-center justify-center mr-3 flex-shrink-0 text-sm">${index + 1}</span>
                        <span class="mt-1">${item.q}</span>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        ${shuffledOptions.map((opt, i) => `
                            <label class="flex items-center p-3 border rounded-lg cursor-pointer hover:bg-slate-50 transition-colors">
                                <input type="radio" name="q${index}" value="${opt.replace(/"/g, '&quot;')}" required class="h-4 w-4 text-indigo-600 focus:ring-indigo-500">
                                <span class="ml-3 text-slate-700">${opt}</span>
                            </label>
                        `).join('')}
                    </div>
                `;
                container.appendChild(div);
            });

            if (window.renderMathInElement) {
                renderMathInElement(container, {
                    delimiters: [
                        { left: "$", right: "$", display: false },
                        { left: "$$", right: "$$", display: true }
                    ]
                });
            }
        }

        window.addEventListener('DOMContentLoaded', renderQuestions);

        document.getElementById('quizForm').onsubmit = function (e) {
            let score = 0;
            questionsData.forEach((item, index) => {
                const selected = document.querySelector(`input[name="q${index}"]:checked`);
                if (selected && selected.value === item.correct) {
                    score++;
                }
            });

            const percent = ((score / questionsData.length) * 100).toFixed(1);
            const scoreSummary = `${score}/${questionsData.length} (${percent}%)`;
            document.getElementById('score_field').value = scoreSummary;

            const name = document.getElementsByName('student_name')[0].value;
            document.getElementById('email_subject').value = `Advanced Vectors Score: ${scoreSummary} | ${name}`;

            if (!confirm(`Your Score: ${scoreSummary}\nClick OK to submit to Mr. Nyantakyi Francis.`)) {
                e.preventDefault();
            }
        };
    </script>
</body>

</html>
