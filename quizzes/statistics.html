<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WASSCE Advanced Statistics | Nyantakyi Francis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
        onload="renderMathInElement(document.body);"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9;
        }

        .question-card {
            border: 1px solid #e2e8f0;
        }

        .table-container {
            overflow-x: auto;
            margin: 1.5rem 0;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            font-size: 0.9rem;
        }

        th,
        td {
            border: 1px solid #cbd5e1;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #f8fafc;
            color: #1e293b;
        }

        .instruction-box {
            border-left: 4px solid #4f46e5;
            background: #eef2ff;
            padding: 1rem;
            margin-bottom: 2rem;
        }
    </style>
</head>

<body class="pb-20">

    <header class="bg-white border-b sticky top-0 z-50 shadow-sm">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="../index.html" class="text-indigo-600 font-bold flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd"
                        d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z"
                        clip-rule="evenodd" />
                </svg>
                Back to Portal
            </a>
            <div class="text-right">
                <h1 class="font-bold text-slate-800">Elective Maths</h1>
                <p class="text-xs text-slate-500 uppercase tracking-widest">Section 9: Statistics (Advanced)</p>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 mt-8">
        <form id="quizForm" action="https://formspree.io/f/xvzbgroo" method="POST">

            <div class="bg-indigo-700 rounded-xl p-8 mb-8 text-white shadow-xl">
                <h2 class="text-2xl font-bold mb-6 text-center underline underline-offset-8">Student Registration</h2>
                <div class="grid gap-6">
                    <input type="text" name="student_name" required placeholder="Full Name"
                        class="w-full px-4 py-3 rounded-lg bg-indigo-800 border-indigo-600 text-white placeholder-indigo-300 focus:outline-none focus:ring-2 focus:ring-white">
                    <div class="grid md:grid-cols-2 gap-6">
                        <input type="email" name="student_email" required placeholder="Email Address"
                            class="w-full px-4 py-3 rounded-lg bg-indigo-800 border-indigo-600 text-white placeholder-indigo-300 focus:outline-none focus:ring-2 focus:ring-white">
                        <input type="tel" name="student_phone" required placeholder="Phone Number"
                            class="w-full px-4 py-3 rounded-lg bg-indigo-800 border-indigo-600 text-white placeholder-indigo-300 focus:outline-none focus:ring-2 focus:ring-white">
                    </div>
                </div>
            </div>

            <div id="questions-container" class="space-y-10"></div>

            <input type="hidden" name="quiz_topic" value="WASSCE Statistics Advanced">
            <input type="hidden" name="final_score" id="score_field">

            <div class="mt-12 text-center p-10 bg-white rounded-2xl shadow-lg border border-slate-200">
                <button type="submit"
                    class="bg-indigo-600 text-white px-12 py-5 rounded-2xl font-bold text-xl hover:bg-indigo-700 transition-all hover:scale-105 shadow-xl shadow-indigo-200">
                    Finish & Submit Examination
                </button>
            </div>
        </form>
    </main>

    <script>
        const questionsData = [
            // SCALES & METHODOLOGY
            { q: "A surveyor records the 'Time of Day' (e.g., 14:00 GMT). This data belongs to which measurement scale?", options: ["Interval", "Nominal", "Ratio", "Ordinal"], correct: "Interval" },
            { q: "A study analyzes 'Efficiency Ranks' of machines (1st, 2nd, 3rd). Identify the scale and the most appropriate measure of central tendency.", options: ["Ordinal; Median", "Ordinal; Mean", "Nominal; Mode", "Ratio; Mean"], correct: "Ordinal; Median" },
            { q: "Which data representation is mathematically most suitable for justifying the continuity of a variable across intervals?", options: ["Histogram", "Bar Chart", "Frequency Polygon", "Pictogram"], correct: "Histogram" },

            // DATA TABLE 1 (Q4-Q8)
            {
                instruction: "Use the table below of student marks to answer the next five questions.",
                table: `<table><tr><th>Marks (%)</th><td>10-19</td><td>20-29</td><td>30-39</td><td>40-49</td><td>50-59</td><td>60-69</td></tr><tr><th>Frequency</th><td>2</td><td>5</td><td>8</td><td>15</td><td>7</td><td>3</td></tr></table>`,
                q: "Calculate the estimated mean mark of the distribution.", options: ["$41.75$", "$40.50$", "$42.25$", "$39.50$"], correct: "$41.75$"
            },
            { q: "Estimate the median of the grouped data from the marks table.", options: ["$42.83$", "$41.50$", "$40.17$", "$44.50$"], correct: "$42.83$" },
            { q: "Find the variance of the distribution in the marks table correct to 2 decimal places.", options: ["$154.69$", "$12.44$", "$165.20$", "$142.11$"], correct: "$154.69$" },
            { q: "Determine the lower quartile ($Q_1$) for this distribution.", options: ["$32.625$", "$30.50$", "$29.50$", "$34.125$"], correct: "$32.625$" },
            { q: "If a student must score at least 50% to pass, what is the probability that a student chosen at random failed?", options: ["$0.75$", "$0.25$", "$0.30$", "$0.65$"], correct: "$0.75$" },

            // REPRESENTATION & JUSTIFICATION
            { q: "To compare the variability of two distributions with different units, which statistic is most justified?", options: ["Coefficient of Variation", "Standard Deviation", "Range", "Variance"], correct: "Coefficient of Variation" },
            { q: "Why is a Bar Chart preferred over a Histogram for 'Eye Color' data?", options: ["Data is qualitative/discrete", "Data is continuous", "Frequencies are too high", "Bar Charts show area"], correct: "Data is qualitative/discrete" },
            { q: "In a cumulative frequency curve (Ogive), the value on the x-axis corresponding to a cumulative frequency of $0.75N$ is the:", options: ["Upper Quartile", "Lower Quartile", "Interquartile Range", "Mode"], correct: "Upper Quartile" },

            // DATA TABLE 2 (Q12-Q15)
            {
                instruction: "The table shows the distribution of heights ($h$) of seedlings.",
                table: `<table><tr><th>Height (cm)</th><td>2.0 ≤ h < 2.5</td><td>2.5 ≤ h < 3.0</td><td>3.0 ≤ h < 3.5</td><td>3.5 ≤ h < 4.0</td></tr><tr><th>Freq</th><td>10</td><td>22</td><td>k</td><td>18</td></tr></table>`,
                q: "If the mean height is $3.125$ cm, calculate the value of $k$.", options: ["$30$", "$25$", "$20$", "$35$"], correct: "$30$"
            },
            { q: "Using $k$ from the previous question, calculate the Standard Deviation.", options: ["$0.56$", "$0.31$", "$1.21$", "$0.88$"], correct: "$0.56$" },
            { q: "What is the modal height class for the seedlings?", options: ["$3.0 ≤ h < 3.5$", "$2.5 ≤ h < 3.0$", "$3.5 ≤ h < 4.0$", "$2.25$"], correct: "$3.0 ≤ h < 3.5$" },
            { q: "Identify the justification for using the mean in this seedling study.", options: ["It uses every data point", "It is unaffected by outliers", "It is easiest to read from a graph", "It represents the most frequent height"], correct: "It uses every data point" },

            // TECHNOLOGY & EXCEL
            { q: "In Excel, you have frequencies in B2:B6 and class marks in C2:C6. Which formula calculates the total sum of $fx$?", options: ["=SUMPRODUCT(B2:B6, C2:C6)", "=SUM(B2:B6)*SUM(C2:C6)", "=AVERAGE(B2:C6)", "=FXSUM(B2:C6)"], correct: "=SUMPRODUCT(B2:B6, C2:C6)" },
            { q: "Which tool is best for automating the creation of a Frequency Distribution Table from 1,000 raw data points?", options: ["Excel Pivot Table", "Manual Tallying", "Excel Sort Function", "Scientific Calculator"], correct: "Excel Pivot Table" },
            { q: "In Excel, the function '=QUARTILE.INC(A1:A50, 2)' is equivalent to which measure?", options: ["Median", "Mean", "Mode", "Range"], correct: "Median" },

            // ADVANCED MEASURES
            { q: "Find the mean deviation of the set $\{10, 12, 18, 20\}$.", options: ["$4$", "$0$", "$5$", "$15$"], correct: "$4$" },
            { q: "If $\\sum f = 100$, $\\sum fx = 2500$ and $\\sum fx^2 = 650000$, calculate the variance.", options: ["$250$", "$6500$", "$25$", "$625$"], correct: "$250$" },
            { q: "A set of data has mean 50 and S.D. 10. If 5 is added to every score, the new mean and S.D. are:", options: ["$55, 10$", "$55, 15$", "$50, 10$", "$50, 15$"], correct: "$55, 10$" },
            { q: "If every value in a set is doubled, the variance becomes:", options: ["$4 \\times$ larger", "$2 \\times$ larger", "Unchanged", "$\sqrt{2} \\times$ larger"], correct: "$4 \\times$ larger" },

            // INTERPRETATION
            { q: "The interquartile range of a distribution is 0. What does this imply?", options: ["The middle 50% of data are identical", "The data has no outliers", "The mean is 0", "All data points are 0"], correct: "The middle 50% of data are identical" },
            { q: "Which representation is most justified for showing the trend of temperature over a 24-hour period?", options: ["Line Graph", "Histogram", "Pie Chart", "Box Plot"], correct: "Line Graph" },
            { q: "In a box plot, the 'whiskers' typically represent:", options: ["Minimum and Maximum values", "Interquartile Range", "Standard Deviation", "The Mean"], correct: "Minimum and Maximum values" },

            // DATA TABLE 3 (Q26-Q30)
            {
                instruction: "The weights (kg) of 40 students are: 45, 52, 48... (Summary provided below).",
                table: `<table><tr><th>Weight ($w$)</th><td>40-44</td><td>45-49</td><td>50-54</td><td>55-59</td></tr><tr><th>Frequency</th><td>6</td><td>14</td><td>12</td><td>8</td></tr></table>`,
                q: "What is the class width of the distribution?", options: ["$5$", "$4$", "$4.5$", "$10$"], correct: "$5$"
            },
            { q: "Calculate the upper class boundary of the third class.", options: ["$54.5$", "$54.0$", "$55.0$", "$49.5$"], correct: "$54.5$" },
            { q: "Find the modal weight using the formula $L + [d_1/(d_1+d_2)]c$.", options: ["$49.5$", "$48.5$", "$50.5$", "$47.5$"], correct: "$49.5$" },
            { q: "Calculate the probability that a student weighs more than 49.5kg.", options: ["$0.5$", "$0.35$", "$0.65$", "$0.8$"], correct: "$0.5$" },
            { q: "Which graph would best justify the 'skewness' of this weight data?", options: ["Frequency Polygon", "Pie Chart", "Bar Chart", "Stem and Leaf"], correct: "Frequency Polygon" },

            // FINAL STRETCH
            { q: "The mean of 5 numbers is 7. If three of the numbers are 5, 8, and 10, find the mean of the other two.", options: ["$6$", "$12$", "$7$", "$5$"], correct: "$6$" },
            { q: "Identify the discrete variable from the list:", options: ["Number of students", "Height of trees", "Weight of salt", "Time taken to run"], correct: "Number of students" },
            { q: "For a perfectly symmetrical distribution, which statement is true?", options: ["Mean = Median = Mode", "Mean > Median", "Mode > Mean", "Variance = 0"], correct: "Mean = Median = Mode" },
            { q: "Calculate the range of $15, -3, 22, 10, 5$.", options: ["$25$", "$19$", "$22$", "$7$"], correct: "$25$" },
            { q: "In an Ogive, the y-axis represents:", options: ["Cumulative Frequency", "Frequency density", "Class marks", "Relative frequency"], correct: "Cumulative Frequency" },
            { q: "The sum of the deviations of a set of values from their mean is always:", options: ["$0$", "$1$", "Positive", "The Variance"], correct: "$0$" },
            { q: "Find the geometric mean of 2, 4, 8.", options: ["$4$", "$4.67$", "$8$", "$14$"], correct: "$4$" },
            { q: "Which measure is most suitable for finding the average size of shoes sold in a shop?", options: ["Mode", "Mean", "Median", "Mid-range"], correct: "Mode" },
            { q: "Find the 50th percentile of any distribution.", options: ["Median", "Mean", "Upper Quartile", "Mode"], correct: "Median" },
            { q: "A distribution has a variance of 0.25. Find the standard deviation.", options: ["$0.5$", "$0.0625$", "$5$", "$0.125$"], correct: "$0.5$" }
        ];

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        const container = document.getElementById('questions-container');

        function renderQuestions() {
            questionsData.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = "question-card bg-white p-8 rounded-2xl shadow-sm border border-slate-200";

                let shuffledOptions = [...item.options];
                shuffleArray(shuffledOptions);

                div.innerHTML = `
                    ${item.instruction ? `<div class="instruction-box font-semibold text-indigo-800 mb-2">${item.instruction}</div>` : ''}
                    ${item.table ? `<div class="table-container">${item.table}</div>` : ''}
                    <div class="font-bold text-slate-800 mb-6 flex items-start text-lg">
                        <span class="bg-indigo-600 text-white rounded-lg w-10 h-10 flex items-center justify-center mr-4 flex-shrink-0 shadow-md">${index + 1}</span>
                        <span class="mt-1">${item.q}</span>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        ${shuffledOptions.map((opt) => `
                            <label class="flex items-center p-4 border-2 border-slate-100 rounded-xl cursor-pointer hover:border-indigo-300 hover:bg-indigo-50 transition-all">
                                <input type="radio" name="q${index}" value="${opt.replace(/"/g, '&quot;')}" required class="h-5 w-5 text-indigo-600">
                                <span class="ml-4 text-slate-700 font-medium">${opt}</span>
                            </label>
                        `).join('')}
                    </div>
                `;
                container.appendChild(div);
            });

            if (window.renderMathInElement) {
                renderMathInElement(container, {
                    delimiters: [
                        { left: "$", right: "$", display: false },
                        { left: "$$", right: "$$", display: true }
                    ]
                });
            }
        }

        window.addEventListener('DOMContentLoaded', renderQuestions);

        document.getElementById('quizForm').onsubmit = function (e) {
            let score = 0;
            questionsData.forEach((item, index) => {
                const selected = document.querySelector(`input[name="q${index}"]:checked`);
                if (selected && selected.value === item.correct) {
                    score++;
                }
            });

            const percent = ((score / questionsData.length) * 100).toFixed(1);
            const scoreSummary = `${score}/${questionsData.length} (${percent}%)`;
            document.getElementById('score_field').value = scoreSummary;

            const name = document.getElementsByName('student_name')[0].value;
            const quote = "Statistical thinking will one day be as necessary for efficient citizenship as the ability to read and write. — H.G. Wells";

            if (!confirm(`Results for ${name}:\nScore: ${scoreSummary}\n\n"${quote}"\n\nClick OK to finalize submission.`)) {
                e.preventDefault();
            }
        };
    </script>
</body>

</html>
