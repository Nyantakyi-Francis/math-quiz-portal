<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Statistics | Nyantakyi Francis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
        onload="renderMathInElement(document.body);"></script>

    <link rel="stylesheet" href="../style.css">
    <!-- Configuration and utilities must be loaded before quiz-engine -->
    <script src="../js/config.js"></script>
    <script src="../shared/script.js"></script>
    <script src="../js/quiz-engine.js"></script>
</head>

<body class="pb-20 bg-slate-50">

    <header class="bg-white border-b sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="../index.html" class="text-indigo-600 font-bold flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd"
                        d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z"
                        clip-rule="evenodd" />
                </svg>
                Back to Portal
            </a>
            <div class="text-right">
                <h1 class="font-bold text-slate-800">Elective Mathematics</h1>
                <p class="text-xs text-slate-500 uppercase tracking-widest">Statistics</p>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 mt-8">
        <form id="quizForm" method="POST">

            <!-- Student Information -->
            <div class="bg-indigo-700 rounded-2xl p-8 mb-8 text-white shadow-lg">
                <h2 class="text-2xl font-bold mb-6 text-center underline underline-offset-8">Student Information</h2>
                <div class="grid gap-6">
                    <div>
                        <label class="block text-sm font-medium text-indigo-100 mb-2">Full Name</label>
                        <input type="text" name="student_name" required placeholder="Enter your full name"
                            class="w-full px-4 py-3 rounded-xl bg-indigo-800 border border-indigo-600 text-white placeholder-indigo-300 focus:outline-none focus:ring-2 focus:ring-white">
                    </div>
                    <div class="grid md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-indigo-100 mb-2">Email Address</label>
                            <input type="email" name="student_email" required placeholder="example@email.com"
                                class="w-full px-4 py-3 rounded-xl bg-indigo-800 border border-indigo-600 text-white placeholder-indigo-300 focus:outline-none focus:ring-2 focus:ring-white">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-indigo-100 mb-2">Phone Number</label>
                            <input type="tel" name="student_phone" required placeholder="e.g. +233 50 000 0000"
                                class="w-full px-4 py-3 rounded-xl bg-indigo-800 border border-indigo-600 text-white placeholder-indigo-300 focus:outline-none focus:ring-2 focus:ring-white">
                        </div>
                    </div>
                </div>
            </div>

            </div>

            <div id="questions-container" class="space-y-6"></div>

            <input type="hidden" name="quiz_topic" id="quiz_topic" value="">
            <input type="hidden" name="final_score" id="score_field">
            <input type="hidden" name="_subject" id="email_subject" value="Statistics Quiz Submission">

            <div class="mt-12 text-center p-10 bg-white rounded-3xl shadow-xl border-t-4 border-indigo-600">
                <p class="text-slate-500 mb-4 font-medium text-sm italic">"Statistics is the grammar of science." – Karl
                    Pearson</p>
                <button type="submit" id="submitBtn"
                    class="bg-indigo-600 text-white px-12 py-4 rounded-2xl font-bold text-lg hover:bg-indigo-700 transition-colors shadow-lg">
                    Finish & Submit Results
                </button>
            </div>
        </form>
    </main>

    <!-- Load Quiz Engine -->
    <script src="../js/quiz-engine.js"></script>

    <script>
        // Table HTML templates
        const tables = {
            table1: `
                <div class="bg-white p-6 rounded-xl shadow-md border-l-4 border-indigo-500 mb-6">
                    <h3 class="font-bold text-lg mb-4 text-indigo-700">Table 1: Scores of 40 Students in Mathematics Test</h3>
                    <div class="overflow-x-auto">
                        <table class="w-full border-collapse border border-slate-300">
                            <thead>
                                <tr class="bg-indigo-100">
                                    <th class="border border-slate-300 px-4 py-2 text-left">Score</th>
                                    <th class="border border-slate-300 px-4 py-2 text-center">5</th>
                                    <th class="border border-slate-300 px-4 py-2 text-center">6</th>
                                    <th class="border border-slate-300 px-4 py-2 text-center">7</th>
                                    <th class="border border-slate-300 px-4 py-2 text-center">8</th>
                                    <th class="border border-slate-300 px-4 py-2 text-center">9</th>
                                    <th class="border border-slate-300 px-4 py-2 text-center">10</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td class="border border-slate-300 px-4 py-2 font-semibold">Frequency</td>
                                    <td class="border border-slate-300 px-4 py-2 text-center">4</td>
                                    <td class="border border-slate-300 px-4 py-2 text-center">7</td>
                                    <td class="border border-slate-300 px-4 py-2 text-center">12</td>
                                    <td class="border border-slate-300 px-4 py-2 text-center">9</td>
                                    <td class="border border-slate-300 px-4 py-2 text-center">5</td>
                                    <td class="border border-slate-300 px-4 py-2 text-center">3</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            `,
            table2: `
                <div class="bg-white p-6 rounded-xl shadow-md border-l-4 border-blue-500 mb-6">
                    <h3 class="font-bold text-lg mb-4 text-blue-700">Table 2: Time Taken by 50 Students to Complete a Task</h3>
                    <div class="overflow-x-auto">
                        <table class="w-full border-collapse border border-slate-300">
                            <thead>
                                <tr class="bg-blue-100">
                                    <th class="border border-slate-300 px-4 py-2 text-left">Class Interval (min)</th>
                                    <th class="border border-slate-300 px-4 py-2 text-center">15-19</th>
                                    <th class="border border-slate-300 px-4 py-2 text-center">20-24</th>
                                    <th class="border border-slate-300 px-4 py-2 text-center">25-29</th>
                                    <th class="border border-slate-300 px-4 py-2 text-center">30-34</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td class="border border-slate-300 px-4 py-2 font-semibold">Frequency</td>
                                    <td class="border border-slate-300 px-4 py-2 text-center">8</td>
                                    <td class="border border-slate-300 px-4 py-2 text-center">18</td>
                                    <td class="border border-slate-300 px-4 py-2 text-center">15</td>
                                    <td class="border border-slate-300 px-4 py-2 text-center">9</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            `,
            table3: `
                <div class="bg-white p-6 rounded-xl shadow-md border-l-4 border-green-500 mb-6">
                    <h3 class="font-bold text-lg mb-4 text-green-700">Table 3: Marks Distribution of Students</h3>
                    <div class="overflow-x-auto">
                        <table class="w-full border-collapse border border-slate-300">
                            <thead>
                                <tr class="bg-green-100">
                                    <th class="border border-slate-300 px-4 py-2 text-left">Marks (Class)</th>
                                    <th class="border border-slate-300 px-4 py-2 text-center">40-49</th>
                                    <th class="border border-slate-300 px-4 py-2 text-center">50-59</th>
                                    <th class="border border-slate-300 px-4 py-2 text-center">60-69</th>
                                    <th class="border border-slate-300 px-4 py-2 text-center">70-79</th>
                                    <th class="border border-slate-300 px-4 py-2 text-center">80-89</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td class="border border-slate-300 px-4 py-2 font-semibold">Frequency</td>
                                    <td class="border border-slate-300 px-4 py-2 text-center">8</td>
                                    <td class="border border-slate-300 px-4 py-2 text-center">15</td>
                                    <td class="border border-slate-300 px-4 py-2 text-center">22</td>
                                    <td class="border border-slate-300 px-4 py-2 text-center">10</td>
                                    <td class="border border-slate-300 px-4 py-2 text-center">5</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            `
        };

        // Load questions from JSON and start quiz
        async function loadAndStartQuiz() {
            try {
                const response = await fetch('../data/statistics.json');
                const quizData = await response.json();

                const quiz = new QuizEngine(
                    quizData.questions,           // Pass only the questions array
                    quizData.title,               // Quiz title
                    "quizzes/statistics.html"     // Current page path (for recent attempts)
                );

                quiz.init();

                // Insert tables at appropriate positions
                setTimeout(() => {
                    const container = document.getElementById('questions-container');
                    const questionCards = container.querySelectorAll('.question-card');
                    
                    // Insert Table 1 before question 1 (index 0)
                    if (questionCards[0]) {
                        questionCards[0].insertAdjacentHTML('beforebegin', tables.table1);
                    }
                    
                    // Insert Table 2 before question 6 (index 5)
                    if (questionCards[5]) {
                        questionCards[5].insertAdjacentHTML('beforebegin', tables.table2);
                    }
                    
                    // Insert Table 3 before question 28 (index 27)
                    if (questionCards[27]) {
                        questionCards[27].insertAdjacentHTML('beforebegin', tables.table3);
                    }

                    // Re-render math after tables are inserted
                    if (window.renderMathInElement) {
                        renderMathInElement(document.body);
                    }
                }, 100);

            } catch (error) {
                console.error("Failed to load questions:", error);
                alert("Error loading quiz questions. Please check if data/statistics.json exists.");
            }
        }

        // Start the quiz when page loads
        document.addEventListener('DOMContentLoaded', loadAndStartQuiz);
        
        // Initialize form with config
        document.addEventListener('DOMContentLoaded', function() {
            const quizForm = document.getElementById('quizForm');
            const module = CONFIG.getModuleById('statistics');
            
            if (quizForm && module) {
                quizForm.action = CONFIG.form.formspreeEndpoint;
                document.getElementById('quiz_topic').value = module.formTopic;
            }
        });        
    </script>
</body>

</html>
