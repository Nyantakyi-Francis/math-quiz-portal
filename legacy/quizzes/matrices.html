<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Matrices | Nyantakyi Francis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
        onload="renderMathInElement(document.body);"></script>

    <link rel="stylesheet" href="../style.css">
    <!-- Configuration and utilities must be loaded before quiz-engine -->
    <script src="../js/config.js"></script>
    <script src="../shared/script.js"></script>
    <script src="../js/quiz-engine.js"></script>
</head>

<body class="pb-20">

    <header class="bg-white border-b sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="../index.html" class="text-indigo-600 font-bold flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd"
                        d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z"
                        clip-rule="evenodd" />
                </svg>
                Back to Portal
            </a>
            <div class="text-right">
                <h1 class="font-bold text-slate-800">Mathematics</h1>
                <p class="text-xs text-slate-500 uppercase tracking-widest">Module 4: Matrices</p>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 mt-8">
        <form id="quizForm" method="POST">

            <div class="bg-indigo-700 rounded-xl p-8 mb-8 text-white shadow-lg">
                <h2 class="text-2xl font-bold mb-6 text-center underline underline-offset-8">Student Information</h2>
                <div class="grid md:grid-cols-1 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-indigo-100 mb-2">Full Name</label>
                        <input type="text" name="student_name" required placeholder="Enter your full name"
                            class="w-full px-4 py-3 rounded-lg bg-indigo-800 border-indigo-600 text-white placeholder-indigo-300 focus:outline-none focus:ring-2 focus:ring-white">
                    </div>
                    <div class="grid md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-indigo-100 mb-2">Email Address</label>
                            <input type="email" name="student_email" required placeholder="example@email.com"
                                class="w-full px-4 py-3 rounded-lg bg-indigo-800 border-indigo-600 text-white placeholder-indigo-300 focus:outline-none focus:ring-2 focus:ring-white">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-indigo-100 mb-2">Phone Number</label>
                            <input type="tel" name="student_phone" required placeholder="e.g. +233 50 000 0000"
                                class="w-full px-4 py-3 rounded-lg bg-indigo-800 border-indigo-600 text-white placeholder-indigo-300 focus:outline-none focus:ring-2 focus:ring-white">
                        </div>
                    </div>
                </div>
            </div>

            <div id="questions-container" class="space-y-6"></div>

            <input type="hidden" name="quiz_topic" id="quiz_topic" value="">
            <input type="hidden" name="final_score" id="score_field">
            <input type="hidden" name="_subject" id="email_subject" value="New Math Quiz Submission">

            <div class="mt-12 text-center p-10 bg-white rounded-2xl shadow-xl border-t-4 border-indigo-600">
                <p class="text-slate-500 mb-4 font-medium text-sm italic">"Mathematics is not about numbers, but about
                    understanding."</p>

                <button type="submit" id="submitBtn"
                    class="bg-indigo-600 text-white px-12 py-4 rounded-xl font-black text-xl hover:bg-indigo-700 transition-all transform hover:scale-105 shadow-indigo-200 shadow-2xl">
                    Finish & Submit Results
                </button>
            </div>
        </form>
    </main>

    <script>
        // Load quiz from JSON and initialize
        async function loadAndStartQuiz() {
            try {
                const quizEngine = await QuizEngine.loadFromJSON('matrices');
                
                // Initialize form action and quiz_topic from config
                const quizForm = document.getElementById('quizForm');
                const module = CONFIG.getModuleById('matrices');
                
                if (quizForm && module) {
                    quizForm.action = CONFIG.form.formspreeEndpoint;
                    document.getElementById('quiz_topic').value = module.formTopic;
                }
                
                // Initialize and render quiz
                quizEngine.init();
            } catch (error) {
                console.error('Error loading quiz:', error);
                document.getElementById('questions-container').innerHTML = `
                    <div class="bg-red-50 border border-red-200 text-red-800 px-6 py-4 rounded-lg">
                        <p class="font-semibold">Error Loading Quiz</p>
                        <p class="text-sm mt-1">${error.message}</p>
                    </div>
                `;
            }
        }

        // Start the quiz when page loads
        document.addEventListener('DOMContentLoaded', loadAndStartQuiz);
    </script>
</body>

</html>
