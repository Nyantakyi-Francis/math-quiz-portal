<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <meta content="#1e3a8a" name="theme-color" />
    <title>Offline · Math Quiz Portal</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial,
          "Apple Color Emoji", "Segoe UI Emoji";
        background: #f8fafc;
        color: #0f172a;
      }

      .wrap {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 28px;
      }

      .card {
        width: min(520px, 100%);
        border-radius: 18px;
        border: 1px solid rgba(148, 163, 184, 0.35);
        background: rgba(255, 255, 255, 0.78);
        box-shadow: 0 30px 80px rgba(15, 23, 42, 0.12);
        padding: 22px 22px 18px;
      }

      h1 {
        margin: 0;
        font-size: 22px;
        letter-spacing: -0.02em;
      }

      p {
        margin: 10px 0 0;
        line-height: 1.6;
        color: #334155;
      }

      .row {
        display: flex;
        gap: 12px;
        margin-top: 18px;
        flex-wrap: wrap;
      }

      a,
      button {
        appearance: none;
        border: 0;
        cursor: pointer;
        text-decoration: none;
        padding: 10px 14px;
        border-radius: 12px;
        font-weight: 600;
        font-size: 14px;
        background: #1e3a8a;
        color: #ffffff;
      }

      button {
        background: #e2e8f0;
        color: #0f172a;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #0b1220;
          color: #e2e8f0;
        }

        .card {
          background: rgba(15, 23, 42, 0.78);
          border-color: rgba(148, 163, 184, 0.18);
          box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
        }

        p {
          color: #cbd5e1;
        }

        button {
          background: rgba(148, 163, 184, 0.14);
          color: #e2e8f0;
        }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <section class="card" role="status">
        <h1>You’re offline</h1>
        <p>
          Math Quiz Portal can’t reach the internet right now. Reconnect and try again.
        </p>
        <div class="row">
          <button onclick="window.location.reload()">Retry</button>
        
        </div>
      </section>
    </main>
  </body>
</html>
